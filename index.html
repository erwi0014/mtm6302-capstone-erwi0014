<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capstone</title>
    <!-- import bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- import fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Mea+Culpa&display=swap" rel="stylesheet">
    <!-- custom styles -->
    <link href="css/main.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-inverse">
      <div class="container-fluid p-0">
        <div class="d-flex justify-content-center p-2 m-auto gap-2">
          <div class="navbar-header flex-grow-1  m-2">
            <a class="navbar-brand display-1 text-wrap">The Pursuit of Trivial Knowledge</a>
          </div>
          <div id="settings-icon" class="p-2 d-flex justify-content-center align-items-center">
            <button class="navbar-toggler p-0 border-0 " type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
              <img src="img/settings.svg" style="width: 2rem;" alt="settings icon">
            </button>
          </div>
        </div>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="d-flex justify-content-around m-auto col-12 col-sm-10 col-md-8 col-lg-10 col-xl-8 gap-1 flex-column flex-md-row flex-wrap">
            <div class="stylish-container col-5 col-sm-12">
              <div class="stylish" id="category-stylish">
                <label>Category:</label>
                <span>
                  <input readonly placeholder="Click to select a category..." id="category-input">
                  <select id="category-select" size="10">
                    <!-- Options will be dynamically populated -->
                  </select>
                </span>
              </div>
            </div>
            <div class="stylish-container col-5 col-sm-12">
              <div class="stylish" id="difficulty-stylish">
                <label>Difficulty:</label>
                <span>
                  <input readonly placeholder="Click to select a difficulty..." id="difficulty-input">
                  <select id="difficulty-select" size="3">
                    <!-- Options will be dynamically populated -->
                  </select>
                </span>
              </div>
            </div>
            <div class="col-2 d-flex flex-column justify-content-end col-10 col-lg-2" id="start-button-container">
              <button id="start-quiz-button" class="btn btn-custom m-0 col-10 m-auto">Start Quiz</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <div id="scorebestContainer" class="container-fluid p-0">
        <ul class="list-unstyled d-flex flex-wrap flex-row">
            <li id="score" class="order-1 order-sm-1 col-6 col-sm-4">
              <div class="framed d-flex flex-column align-content-center justify-content-center text-center">
                <div id="scoreTextContainer" class="d-inline-block bg-contain bg-no-repeat p-3">
                  <p class="display-3 w-auto m-0 p-0" id="scoreNumber">00</p>
                  <p class="display-5 m-0 p-0">Score</p>
                </div>
              </div>
            </li>
            <li class="order-3 order-sm-2 col-8 col-sm-4 m-auto">
              <div id="questionHolder" class="h-100 p-2 align-items-center justify-content-center">
                <h2 id="questionNumber">Question 01</h2>
                <p>
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit. In nibh augue, vehicula quis mi id?
                </p>
            </div>
            </li>
            <li id="best" class="order-2 order-sm-3 col-6 col-sm-4">
              <div class="framed d-flex flex-column align-content-center justify-content-center text-center">
                <div id="bestTextContainer" class="d-inline-block bg-contain bg-no-repeat p-3 w-auto">
                  <p class="display-3 w-auto m-0 p-0" id="bestNumber">00</p>
                  <p class="display-5 w-auto m-0 p-0">Best</p>
                </div>
              </div>
            </li>
        </ul>
    </div>

    <div id="quizContainer" class="col-lg-6 col-md-7 col-sm-12 m-auto">
      
      <div id="answersHolder" class="container-sm">
          <ul class="list-group">
            <li class="list-group-item bg-challenge-color text-light">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio1">
                    <label class="form-check-label" for="radio1">
                    Option 1
                    </label>
                </div>
            </li>
            <li class="list-group-item bg-challenge-color text-light">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio2">
                    <label class="form-check-label" for="radio2">
                    Option 2
                    </label>
                </div>
            </li>
            <li class="list-group-item bg-challenge-color text-light">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio3">
                    <label class="form-check-label" for="radio3">
                    Option 3
                    </label>
                </div>
            </li>
            <li class="list-group-item bg-challenge-color text-light">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="flexRadioDefault" id="radio4">
                    <label class="form-check-label" for="radio4">
                    Option 4
                    </label>
                </div>
            </li>
          </ul>
          <div class="d-flex flex-row-reverse">
            <div class="w-auto">
              <button class="btn btn-outline-success" type="submit">Next Question</button>
            </div>
          </div>
          <div id="taunt-container">
            <div id="speech-bubble">
              <p>Haha, there's no way you can solve this one!</p>
            </div>
            <img src="img/newton.png" alt="Isaac Newton">
            <div class="hitbox"></div>
          </div>
        </div>

    </div>

    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script> -->
    <script src="js/main.js"></script>
    <script>
      const tauntContainer = document.getElementById('taunt-container');
      const newtonImage = document.querySelector('#taunt-container img');
      const newtonImageHitbox = document.querySelector('#taunt-container .hitbox');

      newtonImageHitbox.addEventListener('click', () => {
        newtonImage.classList.add('click-animation');
        setTimeout(() => {
          newtonImage.classList.remove('click-animation');
        }, 1000); // Duration of the animation in milliseconds
      });
    </script>
  </body>
</html>
